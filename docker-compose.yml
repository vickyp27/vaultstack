version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: vaultstack
      POSTGRES_USER: vaultstack
      POSTGRES_PASSWORD: vaultstack123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: vaultstack
      MINIO_ROOT_PASSWORD: vaultstack123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set vs http://minio:9000 vaultstack vaultstack123;
      mc mb vs/vaultstack-backups --ignore-existing;
      mc anonymous set download vs/vaultstack-backups;
      echo 'Bucket ready.';
      "

  vaultstack-api:
    build: ./vaultstack-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vaultstack:vaultstack123@postgres/vaultstack
      REDIS_URL: redis://redis:6379/0
      OS_AUTH_URL: http://172.16.109.210/identity
      OS_USERNAME: admin
      OS_PASSWORD: VaultStack123
      OS_PROJECT_NAME: admin
      OS_USER_DOMAIN_NAME: Default
      OS_PROJECT_DOMAIN_NAME: Default
      BACKUP_BASE_PATH: /var/vaultstack/backups
    volumes:
      - backup_data:/var/vaultstack/backups
      - /opt/vaultstack/vaultstack-api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  vaultstack-worker:
    build: ./vaultstack-worker
    environment:
      DATABASE_URL: postgresql://vaultstack:vaultstack123@postgres/vaultstack
      REDIS_URL: redis://redis:6379/0
      OS_AUTH_URL: http://172.16.109.210/identity
      OS_USERNAME: admin
      OS_PASSWORD: VaultStack123
      OS_PROJECT_NAME: admin
      OS_USER_DOMAIN_NAME: Default
      OS_PROJECT_DOMAIN_NAME: Default
      BACKUP_BASE_PATH: /var/vaultstack/backups
      PYTHONPATH: /api
    volumes:
      - backup_data:/var/vaultstack/backups
      - /opt/vaultstack/vaultstack-api:/api
      - /opt/vaultstack/vaultstack-worker:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  vaultstack-beat:
    build: ./vaultstack-worker
    command: celery -A celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://vaultstack:vaultstack123@postgres/vaultstack
      REDIS_URL: redis://redis:6379/0
      OS_AUTH_URL: http://172.16.109.210/identity
      OS_USERNAME: admin
      OS_PASSWORD: VaultStack123
      OS_PROJECT_NAME: admin
      OS_USER_DOMAIN_NAME: Default
      OS_PROJECT_DOMAIN_NAME: Default
      BACKUP_BASE_PATH: /var/vaultstack/backups
      PYTHONPATH: /api
    volumes:
      - backup_data:/var/vaultstack/backups
      - /opt/vaultstack/vaultstack-api:/api
      - /opt/vaultstack/vaultstack-worker:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  backup_data:
  minio_data:
